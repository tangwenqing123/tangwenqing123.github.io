<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>高山流水 · 遇知音｜金句人格测试</title>
  <meta name="description" content="2 分钟，用金句遇见你灵魂里的知音。选 5 句最戳心的金句，测出你的古典知音人格。" />
  <meta name="theme-color" content="#faf6ef" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🏔️</text></svg>" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

  <!-- ===== 背景装饰 ===== -->
  <div class="bg-decor" aria-hidden="true">
    <div class="blob blob-1"></div>
    <div class="blob blob-2"></div>
  </div>

  <!-- ===== 首页 ===== -->
  <section class="view" id="view-home">
    <div class="hero">
      <svg class="mountain" viewBox="0 0 400 120" aria-hidden="true">
        <path d="M0 120 L80 40 L140 95 L210 25 L280 90 L340 45 L400 100 L400 120 Z" fill="url(#mg)" opacity=".55"/>
        <path d="M0 120 L120 70 L190 110 L260 60 L330 105 L400 75 L400 120 Z" fill="url(#mg2)" opacity=".45"/>
        <defs>
          <linearGradient id="mg" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#6b8f71"/><stop offset="1" stop-color="#3a5a6e"/>
          </linearGradient>
          <linearGradient id="mg2" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#8fa98f"/><stop offset="1" stop-color="#5b7d8f"/>
          </linearGradient>
        </defs>
      </svg>
      <p class="hero-kicker">金句 · 人格 · 遇知音</p>
      <h1 class="hero-title">高山<span>流</span>水</h1>
      <p class="hero-sub">选 5 句最戳心的金句<br/>遇见你灵魂里的知音</p>
      <button class="btn btn-primary" id="btn-start">开始测试<span class="btn-arrow">→</span></button>
      <button class="btn btn-ghost" id="btn-quote-home">🎐 今日一签</button>
      <p class="hero-note">约 2 分钟 · 12+2 位古典知音 · 免费</p>
    </div>
  </section>

  <!-- ===== 测试页 ===== -->
  <section class="view" id="view-test">
    <header class="topbar">
      <button class="icon-btn" id="btn-test-home" title="返回首页">⌂</button>
      <div class="progress-track"><div class="progress-fill" id="progress-fill"></div></div>
      <span class="round-label" id="round-label">第 1 / 5 轮</span>
    </header>
    <div class="test-body">
      <p class="test-tip" id="test-tip">哪一句，最触动你？</p>
      <div class="card-list" id="card-list"></div>
      <button class="btn btn-ghost btn-skip" id="btn-skip">🎲 随缘选一句</button>
    </div>
  </section>

  <!-- ===== 结果页 ===== -->
  <section class="view" id="view-result">
    <div class="result-wrap" id="result-wrap">
      <p class="result-kicker">你的灵魂知音是</p>
      <div class="p-card" id="p-card">
        <div class="p-emoji" id="p-emoji">🎼</div>
        <h2 class="p-name" id="p-name">伯牙</h2>
        <p class="p-title" id="p-title">琴心洞察者</p>
        <p class="p-allusion" id="p-allusion">伯牙善鼓琴，高山流水遇知音</p>
        <p class="p-quote" id="p-quote">「相识满天下，知心能几人」</p>
      </div>
      <div class="p-desc" id="p-desc"></div>
      <div class="p-advice" id="p-advice"></div>
      <div class="p-picks" id="p-picks"></div>
      <div class="result-actions">
        <button class="btn btn-primary" id="btn-poster">🖼️ 生成分享海报</button>
        <button class="btn btn-ghost" id="btn-share">📤 分享</button>
        <button class="btn btn-ghost" id="btn-retest">🔄 再测一次</button>
      </div>
      <div class="debug-row" id="debug-row" style="display:none">
        <button class="btn btn-ghost btn-skip" id="btn-debug-all">🧪 查看全部人格</button>
      </div>
    </div>
  </section>

  <!-- ===== 每日一签 ===== -->
  <section class="view" id="view-quote">
    <header class="topbar">
      <button class="icon-btn" id="btn-quote-back" title="返回">←</button>
      <span class="round-label">今日一签</span>
      <span></span>
    </header>
    <div class="quote-body">
      <div class="quote-card" id="quote-card">
        <p class="quote-mark">「</p>
        <p class="quote-text" id="quote-text">正在求签…</p>
        <p class="quote-author" id="quote-author"></p>
        <p class="quote-mark quote-mark-end">」</p>
      </div>
      <button class="btn btn-ghost" id="btn-quote-refresh">🎲 换一句</button>
      <button class="btn btn-primary" id="btn-quote-share">📤 分享这签</button>
    </div>
  </section>

  <!-- ===== 海报弹窗 ===== -->
  <div class="modal" id="poster-modal">
    <div class="modal-inner">
      <img id="poster-img" alt="分享海报" />
      <div class="modal-actions">
        <a class="btn btn-primary" id="poster-download" download="gaoshan-liushui.png">⬇️ 保存海报</a>
        <button class="btn btn-ghost" id="poster-close">关闭</button>
      </div>
    </div>
  </div>

  <footer class="site-footer">
    <p>高山流水 · 遇知音 —— 金句人格测试</p>
    <p class="disclaimer">本测试仅供自我探索与娱乐，不构成任何医疗诊断或心理评估。</p>
  </footer>

  <script src="js/data/personas.js"></script>
  <script src="js/data/quotes.js"></script>
  <script src="js/engine.js"></script>
  <script src="js/quote.js"></script>
  <script src="js/poster.js"></script>
  <script src="js/result.js"></script>
  <script src="js/app.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js" defer></script>
</body>
</html>
